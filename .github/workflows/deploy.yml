name: Build
#name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_NAME: summit-stats-1
  OWNER_ID: summit-stats-repo
  IMAGE_NAME: strava_analyser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      commit_sha: ${{ steps.set_sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set commit SHA
        id: set_sha
        run: echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.PROJECT_NAME }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push backend image
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.PROJECT_NAME }}/summit-stats-repo/strava_analyser"
          docker buildx create --use
          docker buildx build \
            --cache-from=type=registry,ref=$IMAGE:buildcache \
            --cache-to=type=registry,ref=$IMAGE:buildcache,mode=max \
            -t "$IMAGE:${{ github.sha }}" \
            --push .

      - name: Build and Push frontend image
        working-directory: frontend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.PROJECT_NAME }}/summit-stats-frontend-repo/summit-stats-frontend"
          docker buildx create --use
          docker buildx build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.BACKEND_URL }}" \
            --cache-from=type=registry,ref=$IMAGE:buildcache \
            --cache-to=type=registry,ref=$IMAGE:buildcache,mode=max \
            -t "$IMAGE:${{ github.sha }}" \
            --push .

      - name: Build and Push migrations image
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.PROJECT_NAME }}/summit-stats-migrations-repo/summit-stats-migrations"
          docker buildx create --use
          docker buildx build \
          --file migrations.dockerfile \
            --cache-from=type=registry,ref=$IMAGE:buildcache \
            --cache-to=type=registry,ref=$IMAGE:buildcache,mode=max \
            -t "$IMAGE:${{ github.sha }}" \
            --push .

