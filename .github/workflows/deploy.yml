name: Build and Push to Artifact Registry

on:
  push:
  #    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_NAME: summit-stats-1
  OWNER_ID: summit-stats-repo
  IMAGE_NAME: strava_analyser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push backend image
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/summit-stats-repo/strava_analyser"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Build and Push frontend image
        working-directory: frontend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/summit-stats-frontend-repo/summit-stats-frontend"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Initialize Terraform
        working-directory: iac
        run: terraform init

      - name: Apply Terraform with commit SHA
        working-directory: iac
        run: |
          terraform apply \
            -auto-approve \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="frontend_image_tag=${{ github.sha }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="owner_id=${{ secrets.owner_id }}" \
            -var="project_id=${{ secrets.project_id }}" \
            -var="project_name=${{ secrets.project_name }}" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="client_id=${{ secrets.client_id }}" \
            -var="client_secret=${{ secrets.client_secret }}" \

